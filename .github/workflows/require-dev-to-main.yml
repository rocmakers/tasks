name: require-dev-to-main

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  require-dev:
    name: require-dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Allow only the dev branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Only the 'dev' branch can be merged into main (this PR is from '$HEAD_REF')."
            exit 1
          fi
          echo "Source branch is dev."
